# 本流程在支持的 macOS arm64 上执行合成验收；不部署、不读 secrets、不上传正文或认证材料。
name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Record supported toolchain
        run: |
          test "$(go env GOOS)" = darwin
          test "$(go env GOARCH)" = arm64
          go version
          node --version
      - name: Prepare dependencies
        run: make deps browser-install
      - name: Run checks and real system/browser acceptance
        run: make verify
      - name: Upload limited acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            .test-data/verification-*/result.json
            .test-data/verification-*/*.png
          if-no-files-found: warn
          retention-days: 7
